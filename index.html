<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gold Catalog — Vape, Velo & Shisha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 0;
      transition: background 0.5s, color 0.5s;
    }

    header {
      background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
      background-size: 200% 200%;
      animation: glitter 3s linear infinite;
      text-align: center;
      padding: 20px;
      font-size: 2em;
      font-weight: bold;
      color: #000;
      text-shadow: 0 0 10px #fff, 0 0 20px #FFD700;
    }
    @keyframes glitter {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #controls, #velo-categories, #polls, #theme-switcher, #accessibility {
      text-align: center;
      padding: 15px;
      background: #222;
    }
    #controls input, #controls select, #controls button,
    #velo-categories button, #polls button, #theme-switcher button, #accessibility button {
      margin: 5px;
      padding: 8px 12px;
      border-radius: 5px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      background: #FFD700;
    }
    #controls button:hover, #velo-categories button:hover,
    #polls button:hover, #theme-switcher button:hover, #accessibility button:hover {
      background: #FFA500;
    }

    #product-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product-card {
      background: #222;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .product-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #FFD700;
    }
    .product-card img {
      max-width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    #slideshow {
      display: flex;
      overflow: hidden;
      width: 100%;
      background: #333;
      padding: 20px;
    }
    #slideshow img {
      width: 200px;
      height: 150px;
      margin-right: 20px;
      border-radius: 8px;
    }

    #fun-facts {
      background: #222;
      color: #FFD700;
      text-align: center;
      padding: 20px;
      font-size: 1.2em;
      animation: fade 1s ease-in-out;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    #suggestion-box {
      background: #333;
      padding: 20px;
      text-align: center;
    }
    #suggestion-box input { padding: 10px; width: 60%; border-radius: 5px; }
    #suggestion-box button { padding: 10px; background: #FFD700; border: none; border-radius: 5px; }

    @keyframes floatFlowers {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-800px) rotate(360deg); opacity: 0; }
    }
    .flower {
      position: fixed;
      bottom: -50px;
      width: 40px;
      height: 40px;
      background-image: url('images/flower.png');
      background-size: cover;
      animation: floatFlowers 15s linear infinite;
    }
  </style>
</head>
<body>
  <header>🌸🔥 Gold Catalog — Vape, Velo & Shisha 🔥🌸</header>

  <div id="controls">
    <button onclick="filterCategory('Vape')">💨 Vape</button>
    <button onclick="filterCategory('Velo')">🍃 Velo</button>
    <button onclick="filterCategory('Shisha')">🌙 Shisha</button>
    <button onclick="filterCategory('All')">🌍 All</button>
    <input type="text" id="search" placeholder="🔍 Search products..." oninput="applyFilters()">
    <select id="sort" onchange="applyFilters()">
      <option value="">✨ Sort</option>
      <option value="price-asc">💰 Price ↑</option>
      <option value="price-desc">💰 Price ↓</option>
      <option value="puffs-asc">💨 Puffs ↑</option>
      <option value="puffs-desc">💨 Puffs ↓</option>
    </select>
  </div>

  <div id="velo-categories">
    <button onclick="filterVeloDots(3)">🌸 Velo 3 Dots</button>
    <button onclick="filterVeloDots(4)">🌼 Velo 4 Dots</button>
    <button onclick="filterVeloDots(5)">🌺 Velo 5 Dots</button>
    <button onclick="filterVeloDots(6)">🌻 Velo 6 Dots</button>
    <button onclick="filterVeloDots(7)">🌹 Velo 7 Dots</button>
  </div>

  <div id="slideshow"></div>
  <div id="product-container"></div>
  <div id="fun-facts">💡 Did you know? Velo was first launched in Sweden! 🇸🇪</div>

  <div id="suggestion-box">
    <h3>🌸 Suggestion Box 🌸</h3>
    <input type="text" id="suggestion-input" placeholder="💡 Share your idea...">
    <button onclick="addSuggestion()">🌼 Submit</button>
    <div id="suggestion-list"></div>
  </div>

  <div id="polls">
    <h3>📊 Flavor Poll</h3>
    <button onclick="vote('Mango')">🥭 Mango</button>
    <button onclick="vote('Mint')">🌿 Mint</button>
    <button onclick="vote('Berry')">🍓 Berry</button>
    <div id="poll-results"></div>
  </div>

  <div id="theme-switcher">
    <button onclick="switchTheme('gold')">✨ Gold Mode</button>
    <button onclick="switchTheme('neon')">🌌 Neon Mode</button>
  </div>

  <div id="accessibility">
    <button onclick="toggleLargeText()">🔍 Large Text</button>
    <button onclick="toggleContrast()">🌑 High Contrast</button>
  </div>

  <script>
    let allProducts = [];
    let currentCategory = 'All';
    let funFacts = [
      "💡 Did you know? Velo was first launched in Sweden! 🇸🇪",
      "🌸 Fun Fact: Shisha dates back hundreds of years in Persia! 🏺",
      "🔥 Vape devices can reach up to 15,000 puffs! 💨",
      "🍃 Velo dots indicate strength levels from mild to max! 💪"
    ];
    let factIndex = 0;

    async function loadProducts() {
      const response = await fetch('data/products/product.json');
      allProducts = await response.json();
      applyFilters();
      rotateFunFacts();
      spawnFlowers();
      renderSuggestions();
      renderVotes();
    }

    function applyFilters() {
      let filtered = allProducts;
      const searchTerm = document.getElementById('search').value.toLowerCase();
      if (searchTerm) {
        filtered = filtered.filter(p =>
          p.name.toLowerCase().includes(searchTerm) ||
          p.flavor.toLowerCase().includes(searchTerm) ||
          p.tagline.toLowerCase().includes(searchTerm)
        );
      }
      renderProducts(filtered);
    }

    function filterCategory(category) {
      currentCategory = category;
      applyFilters();
    }

    function filterVeloDots(dots) {
      const filtered = allProducts.filter(p => p.veloDots === dots);
      renderProducts(filtered);
    }
