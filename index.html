<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Gold Catalog — Vape, Velo & Shisha</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      transition: background 0.3s, color 0.3s;
    }

    /* Gold Theme (Default) */
    body.gold {
      background: #0a0a0a;
      color: #f0f0f0;
    }
    body.gold .product-card {
      background: linear-gradient(135deg, #1a1a2a, #16213e);
      border: 1px solid #FFD700;
    }
    body.gold button, body.gold .theme-btn, body.gold .filter-btn {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
    }

    /* Neon Theme */
    body.neon {
      background: #000;
      color: #0f0;
    }
    body.neon .product-card {
      background: #111;
      border: 1px solid #0f0;
      box-shadow: 0 0 15px #0f0;
    }
    body.neon button, body.neon .theme-btn, body.neon .filter-btn {
      background: #0f0;
      color: #000;
      text-shadow: none;
    }
    body.neon .product-name {
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
    }

    /* Large Text Mode */
    body.large-text {
      font-size: 1.2rem;
    }
    body.large-text .product-name {
      font-size: 1.5rem;
    }
    body.large-text .product-card {
      padding: 20px;
    }

    /* High Contrast Mode */
    body.high-contrast {
      background: #000;
      color: #fff;
    }
    body.high-contrast .product-card {
      background: #222;
      border: 2px solid #fff;
    }
    body.high-contrast button {
      background: #fff;
      color: #000;
      border: 2px solid #000;
    }

    header {
      background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
      background-size: 200% 200%;
      animation: glitter 3s linear infinite;
      text-align: center;
      padding: 25px;
      font-size: 2rem;
      font-weight: bold;
      color: #000;
      text-shadow: 0 0 10px #fff, 0 0 20px #FFD700;
      letter-spacing: 2px;
    }
    @keyframes glitter {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .controls-section {
      background: rgba(0,0,0,0.7);
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      border-bottom: 1px solid #FFD700;
    }
    .controls-section input, .controls-section select, .controls-section button {
      padding: 10px 15px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .controls-section input {
      width: 250px;
      background: #333;
      color: #fff;
      border: 1px solid #FFD700;
    }
    .controls-section input::placeholder {
      color: #aaa;
    }

    .category-buttons, .velo-buttons, .accessibility-bar, .theme-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border-bottom: 1px solid #FFD700;
    }
    .category-buttons button, .velo-buttons button, .accessibility-bar button, .theme-bar button {
      padding: 8px 16px;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .category-buttons button:hover, .velo-buttons button:hover {
      transform: scale(1.05);
    }

    /* Slideshow */
    .slideshow-container {
      background: #111;
      padding: 15px;
      border-bottom: 1px solid #FFD700;
    }
    .slideshow-container h3 {
      text-align: center;
      margin-bottom: 10px;
      color: #FFD700;
    }
    .slideshow-track {
      display: flex;
      overflow-x: auto;
      gap: 15px;
      padding: 10px;
      scrollbar-width: thin;
    }
    .slideshow-track::-webkit-scrollbar {
      height: 5px;
    }
    .slideshow-track::-webkit-scrollbar-track {
      background: #333;
      border-radius: 10px;
    }
    .slideshow-track::-webkit-scrollbar-thumb {
      background: #FFD700;
      border-radius: 10px;
    }
    .slideshow-item {
      min-width: 180px;
      background: #222;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      border: 1px solid #FFD700;
    }
    .slideshow-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Product Grid */
    .product-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      padding: 25px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .product-card {
      background: linear-gradient(135deg, #1a1a2a, #16213e);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid #FFD700;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(255,215,0,0.5);
    }
    .product-card img {
      max-width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
    }
    .product-name {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 10px 0 5px;
      color: #FFD700;
    }
    .product-flavor {
      font-size: 0.85rem;
      opacity: 0.8;
    }
    .product-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: #FFA500;
      margin: 8px 0;
    }
    .product-old-price {
      font-size: 0.8rem;
      color: #ff6666;
      text-decoration: line-through;
      margin-right: 8px;
    }
    .product-puffs {
      font-size: 0.8rem;
      background: rgba(255,215,0,0.2);
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .velo-dots {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin: 8px 0;
    }
    .velo-dot {
      width: 12px;
      height: 12px;
      background: #FFD700;
      border-radius: 50%;
    }
    .add-to-cart {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }
    .add-to-cart:hover {
      transform: scale(1.05);
    }

    /* Fun Facts */
    .fun-facts {
      background: #222;
      color: #FFD700;
      text-align: center;
      padding: 15px;
      font-size: 1.1rem;
      border-top: 1px solid #FFD700;
      border-bottom: 1px solid #FFD700;
    }

    /* Suggestion Box */
    .suggestion-box, .poll-box {
      background: #1a1a2a;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #FFD700;
    }
    .suggestion-box input, .poll-box input {
      padding: 10px;
      width: 60%;
      border-radius: 30px;
      border: 1px solid #FFD700;
      background: #333;
      color: #fff;
    }
    .suggestion-box button, .poll-box button {
      padding: 10px 20px;
      background: #FFD700;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
    }
    .suggestion-list {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .suggestion-item {
      background: #333;
      padding: 5px 15px;
      border-radius: 30px;
      font-size: 0.85rem;
    }
    .poll-results {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .poll-result {
      background: #333;
      padding: 5px 15px;
      border-radius: 30px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* Floating Flowers */
    .flower {
      position: fixed;
      bottom: -50px;
      width: 35px;
      height: 35px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23FFD700"><path d="M12,2C8,2 4,4 4,8c0,4 8,12 8,12s8-8 8-12c0-4-4-6-8-6z"/></svg>');
      background-size: cover;
      animation: floatFlowers 12s linear infinite;
      pointer-events: none;
      z-index: 999;
    }
    @keyframes floatFlowers {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

      { id: 205, name: "Al Fakher Double Apple", flavor: "Apple + Anise", price: 2200, oldPrice: 2800, puffs: 0, category: "Shisha", img: "", tagline: "Traditional", rating: 4.4 },

      { id: 207, name: "Adalya Lady Killer", flavor: "Mango, Melon, Berries, Mint", price: 2800, oldPrice: 3600, puffs: 0, category: "Shisha", img: "", tagline: "Tropical", rating: 4.6 }
    ];

    // Featured products for slideshow
    const featuredProducts = products.slice(0, 8);

    let currentFilter = "All";
    let currentVeloDots = null;

    // Helper functions
    function renderVeloDots(dots) {
      if (!dots) return '';
      let html = '<div class="velo-dots">';
      for (let i = 0; i < dots; i++) html += '<div class="velo-dot"></div>';
      html += '</div>';
      return html;
    }

    function getSortFunction(sortValue) {
      switch(sortValue) {
        case 'price-asc': return (a,b) => a.price - b.price;
        case 'price-desc': return (a,b) => b.price - a.price;
        case 'puffs-asc': return (a,b) => (a.puffs || 0) - (b.puffs || 0);
        case 'puffs-desc': return (a,b) => (b.puffs || 0) - (a.puffs || 0);
        case 'name-asc': return (a,b) => a.name.localeCompare(b.name);
        default: return null;
      }
    }

    function renderProducts() {
      let filtered = [...products];
      
      // Apply category filter
      if (currentFilter !== "All") {
        filtered = filtered.filter(p => p.category === currentFilter);
      }
      
      // Apply velo dots filter
      if (currentVeloDots !== null) {
        filtered = filtered.filter(p => p.veloDots === currentVeloDots);
      }
      
      // Apply search
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      if (searchTerm) {
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(searchTerm) || 
          p.flavor.toLowerCase().includes(searchTerm) ||
          (p.tagline && p.tagline.toLowerCase().includes(searchTerm))
        );
      }
      
      // Apply sort
      const sortValue = document.getElementById('sortSelect').value;
      const sortFn = getSortFunction(sortValue);
      if (sortFn) filtered.sort(sortFn);
      
      // Render
      const container = document.getElementById('productContainer');
      const placeholderImg = 'https://placehold.co/300x200/FFD700/1a1a2a?text=Product';
      
      container.innerHTML = filtered.map(p => `
        <div class="product-card">
          <img src="${p.img || placeholderImg}" alt="${p.name}" onerror="this.src='${placeholderImg}'">
          <div class="product-name">${p.name}</div>
          <div class="product-flavor">${p.flavor}</div>
          ${p.veloDots ? renderVeloDots(p.veloDots) : ''}
          <div class="product-price">
            ${p.oldPrice ? `<span class="product-old-price">KES ${p.oldPrice.toLocaleString()}</span>` : ''}
            KES ${p.price.toLocaleString()}
          </div>
          ${p.puffs > 0 ? `<div class="product-puffs">💨 ${p.puffs.toLocaleString()} puffs</div>` : ''}
          <div style="font-size:0.7rem; margin:5px 0; opacity:0.7;">⭐ ${p.rating} / 5</div>
          <button class="add-to-cart" onclick="addToCart('${p.name}', ${p.price})">🛒 Add to Cart</button>
        </div>
      `).join('');
    }

    function renderSlideshow() {
      const track = document.getElementById('slideshowTrack');
      const placeholderImg = 'https://placehold.co/200x120/FFD700/1a1a2a?text=Featured';
      track.innerHTML = featuredProducts.map(p => `
        <div class="slideshow-item">
          <img src="${p.img || placeholderImg}" alt="${p.name}">
          <div style="font-weight:bold; margin-top:5px;">${p.name}</div>
          <div style="font-size:0.7rem;">KES ${p.price}</div>
        </div>
      `).join('');
    }

    // Cart functions
    let cart = JSON.parse(localStorage.getItem('goldCart') || '[]');
    function addToCart(name, price) {
      cart.push({ name, price, quantity: 1 });
      localStorage.setItem('goldCart', JSON.stringify(cart));
      alert(`✨ ${name} added to cart! ✨`);
    }

    // Filter functions
    function filterCategory(category) {
      currentFilter = category;
      currentVeloDots = null;
      renderProducts();
    }
    function filterVeloDots(dots) {
      currentVeloDots = dots;
      currentFilter = "Velo";
      renderProducts();
    }

    // Theme & Accessibility
    function switchTheme(theme) {
      document.body.classList.remove('gold', 'neon');
      document.body.classList.add(theme);
    }
    function toggleLargeText() {
      document.body.classList.toggle('large-text');
    }
    function toggleHighContrast() {
      document.body.classList.toggle('high-contrast');
    }

    // Fun Facts
    const funFacts = [
      "💡 Did you know? Velo was first launched in Sweden! 🇸🇪",
      "🌸 Fun Fact: Shisha dates back hundreds of years in Persia! 🏺",
      "🔥 Vape devices can reach up to 15,000 puffs! 💨",
      "🍃 Velo dots indicate strength levels from mild to max! 💪",
      "✨ Gold is the color of premium quality!",
      "🌙 Tangiers Cane Mint is aged for 2 weeks before sale!",
      "💨 The world record for largest vape cloud is 33.8 meters cubed!"
    ];
    let factIndex = 0;
    function rotateFunFacts() {
      const factEl = document.getElementById('funFacts');
      if (factEl) {
        factIndex = (factIndex + 1) % funFacts.length;
        factEl.innerHTML = funFacts[factIndex];
      }
    }
    setInterval(rotateFunFacts, 8000);

    // Suggestion Box
    function addSuggestion() {
      const input = document.getElementById('suggestionInput');
      const text = input.value.trim();
      if (!text) return;
      let suggestions = JSON.parse(localStorage.getItem('goldSuggestions') || '[]');
      suggestions.push({ text, date: new Date().toISOString() });
      localStorage.setItem('goldSuggestions', JSON.stringify(suggestions));
      input.value = '';
      renderSuggestions();
    }
    function renderSuggestions() {
      const suggestions = JSON.parse(localStorage.getItem('goldSuggestions') || '[]');
      const container = document.getElementById('suggestionList');
      container.innerHTML = suggestions.slice(-10).map(s => `<span class="suggestion-item">🌸 ${s.text}</span>`).join('');
    }

    // Poll/Voting
    let votes = JSON.parse(localStorage.getItem('goldVotes') || '{"Mango":0,"Mint":0,"Berry":0,"Citrus":0}');
    function vote(flavor) {
      votes[flavor] = (votes[flavor] || 0) + 1;
      localStorage.setItem('goldVotes', JSON.stringify(votes));
      renderVotes();
    }
    function renderVotes() {
      const container = document.getElementById('pollResults');
      const total = Object.values(votes).reduce((a,b) => a + b, 0);
      container.innerHTML = Object.entries(votes).map(([flavor, count]) => `
        <div class="poll-result">${flavor}: ${count} vote${count !== 1 ? 's' : ''} ${total > 0 ? `(${Math.round(count/total*100)}%)` : ''}</div>
      `).join('');
    }

    // Floating Flowers
    function spawnFlowers() {
      setInterval(() => {
        const flower = document.createElement('div');
        flower.classList.add('flower');
        flower.style.left = Math.random() * 100 + '%';
        flower.style.animationDuration = 8 + Math.random() * 7 + 's';
        flower.style.opacity = 0.3 + Math.random() * 0.5;
        document.body.appendChild(flower);
        setTimeout(() => flower.remove(), 15000);
      }, 3000);
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', () => renderProducts());
    document.getElementById('sortSelect').addEventListener('change', () => renderProducts());

    // Initialize
    renderProducts();
    renderSlideshow();
    renderSuggestions();
    renderVotes();
    spawnFlowers();
  </script>
</body>
</html>
