<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibes on Vibes — Admin Control Hub</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #17171a;
      --surface-2: #1f1f24;
      --border: #2a2a31;
      --text: #ececf1;
      --muted: #9a9aa8;
      --accent: #c6ff3d;
      --accent-dim: #9fcc2f;
      --danger: #ff5a5a;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 15px;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* ---------- Header ---------- */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
      flex-wrap: wrap; gap: 12px;
    }
    .logo { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
    .logo span { color: var(--accent); }
    .badge {
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 4px 12px; border-radius: 999px; font-size: 12px; color: var(--accent);
    }

    /* ---------- Buttons & Inputs ---------- */
    .btn {
      padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px;
      cursor: pointer; border: none; transition: 0.15s;
    }
    .btn-accent { background: var(--accent); color: #0d0d0f; }
    .btn-accent:hover { background: var(--accent-dim); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(255, 90, 90, 0.15); color: var(--danger); border: 1px solid rgba(255, 90, 90, 0.3); padding: 6px 12px; font-size: 12.5px; }

    input, select, textarea {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); padding: 11px 14px; border-radius: 8px; font-size: 14px;
      margin-top: 6px; margin-bottom: 16px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    label { font-size: 13px; font-weight: 600; color: var(--muted); }

    /* ---------- Login Gate ---------- */
    #loginBox {
      max-width: 400px; margin: 60px auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 28px;
    }
    #loginBox h2 { margin-bottom: 8px; font-size: 20px; }
    #loginBox p { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }

    /* ---------- Dashboard Grid ---------- */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px; margin-bottom: 24px;
    }
    .panel h3 { font-size: 16px; margin-bottom: 16px; color: var(--accent); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 600px) { .row-2 { grid-template-columns: 1fr; gap: 0; } }

    /* ---------- Inventory Table / List ---------- */
    .item-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 14px; border-radius: 8px; margin-bottom: 10px; gap: 12px; flex-wrap: wrap;
    }
    .item-info h4 { font-size: 15px; margin-bottom: 2px; }
    .item-info p { font-size: 12.5px; color: var(--muted); }
    .item-actions { display: flex; align-items: center; gap: 8px; }
    .stock-toggle {
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none;
    }
    .in-stock { background: rgba(198, 255, 61, 0.15); color: var(--accent); }
    .out-stock { background: rgba(255, 90, 90, 0.15); color: var(--danger); }
  </style>
</head>
<body>

  <!-- ============ ADMIN LOGIN SCREEN ============ -->
  <div id="loginBox">
    <div class="logo" style="margin-bottom:14px;">VIBES ON <span>VIBES</span></div>
    <h2>Admin Access</h2>
    <p>Enter your admin PIN to manage Ruiru inventory, prices, and product uploads.</p>
    <label for="adminPin">Admin PIN</label>
    <input type="password" id="adminPin" placeholder="Enter PIN (Default: 166003)">
    <button class="btn btn-accent" style="width:100%;" onclick="checkLogin()">Unlock Dashboard</button>
    <p id="loginError" style="color:var(--danger); margin-top:10px; margin-bottom:0; display:none;">Incorrect PIN. Try again.</p>
  </div>

  <!-- ============ MAIN ADMIN DASHBOARD ============ -->
  <div id="adminDashboard" class="container" style="display:none;">
    <header>
      <div>
        <div class="logo">VIBES ON <span>VIBES</span> • ADMIN</div>
        <span style="font-size:12.5px; color:var(--muted);">Paybill: 714888 | Acc: 166003 | Ruiru Hub</span>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <a href="index.html" class="btn btn-ghost" style="text-decoration:none;">View Storefront →</a>
        <button class="btn btn-ghost" onclick="logout()">Lock</button>
      </div>
    </header>

    <!-- ADD NEW PRODUCT FORM -->
    <div class="panel">
      <h3>+ Add New Product to Store</h3>
      <div class="row-2">
        <div>
          <label>Product Name</label>
          <input type="text" id="pName" placeholder="e.g. Velo Freeze Max (10mg)">
        </div>
        <div>
          <label>Category</label>
          <select id="pCat">
            <option value="pouches">Nicotine Pouches</option>
            <option value="vapes">Vapes & Disposables</option>
            <option value="hookah">Shisha & Hookah</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div>
          <label>Selling Price (KES)</label>
          <input type="number" id="pPrice" placeholder="e.g. 550">
        </div>
        <div>
          <label>Original "Was" Price (Optional, KES)</label>
          <input type="number" id="pWasPrice" placeholder="e.g. 800">
        </div>
      </div>

      <div class="row-2">
        <div>
          <label>Key Spec (Strength / Puffs / Pack Size)</label>
          <input type="text" id="pSpec" placeholder="e.g. 10mg per pouch · 20 cans">
        </div>
        <div>
          <label>Product Photo Filename or Image URL</label>
          <input type="text" id="pImage" placeholder="e.g. images/velo-freeze.jpg">
        </div>
      </div>

      <label>Short Flavor / Description</label>
      <input type="text" id="pDesc" placeholder="e.g. Intense peppermint & icy menthol finish">

      <button class="btn btn-accent" onclick="addProduct()">Publish Product</button>
    </div>

    <!-- ACTIVE INVENTORY LIST -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin:0;">Manage Live Inventory (<span id="totalItems">0</span>)</h3>
        <button class="btn btn-ghost" style="padding:6px 12px; font-size:12px;" onclick="exportCatalogJSON()">Export Backup JSON</button>
      </div>
      <div id="inventoryList"></div>
    </div>
  </div>

  <script>
    // Default PIN matches your M-Pesa Account Number (166003) - change this anytime!
    const ADMIN_PIN = "166003";

    // Default starter catalog if none exists yet
    const starterCatalog = [
      { id: 1, name: "Zonnic Chill Mint (4mg)", cat: "pouches", price: 500, wasPrice: 750, spec: "4mg · 24 pouches", image: "151411.jpg", desc: "Refreshing mint · nicotine replacement therapy pouch", inStock: true },
      { id: 2, name: "Velo Easy Mint", cat: "pouches", price: 450, wasPrice: 650, spec: "6mg · 20 pouches", image: "", desc: "Gentle spearmint & cooling menthol", inStock: true },
      { id: 3, name: "Happy Bar 5,000", cat: "vapes", price: 1600, wasPrice: 0, spec: "5,000 Puffs · Rechargeable", image: "", desc: "Rechargeable disposable · flavour confirmed on order", inStock: true },
      { id: 4, name: "Hookah Starter Set", cat: "hookah", price: 5500, wasPrice: 6500, spec: "Complete Set", image: "", desc: "Stem, base, hose, bowl, tongs included", inStock: true }
    ];

    let catalog = [];
    try {
      const saved = localStorage.getItem('vov_admin_catalog');
      catalog = saved ? JSON.parse(saved) : starterCatalog;
    } catch (e) {
      catalog = starterCatalog;
    }

    function checkLogin() {
      const entered = document.getElementById('adminPin').value.trim();
      if (entered === ADMIN_PIN) {
        sessionStorage.setItem('vov_admin_auth', '1');
        showDashboard();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('vov_admin_auth');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
      renderInventory();
    }

    if (sessionStorage.getItem('vov_admin_auth') === '1') {
      showDashboard();
    }

    function saveCatalog() {
      localStorage.setItem('vov_admin_catalog', JSON.stringify(catalog));
      renderInventory();
    }

    function addProduct() {
      const name = document.getElementById('pName').value.trim();
      const cat = document.getElementById('pCat').value;
      const price = parseInt(document.getElementById('pPrice').value, 10);
      const wasPrice = parseInt(document.getElementById('pWasPrice').value, 10) || 0;
      const spec = document.getElementById('pSpec').value.trim();
      const image = document.getElementById('pImage').value.trim();
      const desc = document.getElementById('pDesc').value.trim();

      if (!name || !price) {
        alert("Please enter at least a Product Name and Selling Price.");
        return;
      }

      catalog.unshift({
        id: Date.now(),
        name, cat, price, wasPrice, spec, image, desc,
        inStock: true
      });

      saveCatalog();

      // Clear form
      ['pName', 'pPrice', 'pWasPrice', 'pSpec', 'pImage', 'pDesc'].forEach(id => document.getElementById(id).value = '');
      alert(`"${name}" added to your inventory!`);
    }

    function toggleStock(id) {
      const item = catalog.find(p => p.id === id);
      if (item) {
        item.inStock = !item.inStock;
        saveCatalog();
      }
    }

    function editPrice(id) {
      const item = catalog.find(p => p.id === id);
      if (!item) return;
      const newPrice = prompt(`Enter new price (KES) for ${item.name}:`, item.price);
      if (newPrice && !isNaN(newPrice)) {
        item.price = parseInt(newPrice, 10);
        saveCatalog();
      }
    }

    function deleteProduct(id) {
      if (confirm("Remove this product permanently?")) {
        catalog = catalog.filter(p => p.id !== id);
        saveCatalog();
      }
    }

    function renderInventory() {
      document.getElementById('totalItems').textContent = catalog.length;
      const list = document.getElementById('inventoryList');
      list.innerHTML = catalog.map(item => `
        <div class="item-row">
          <div class="item-info">
            <h4>${item.name} <span style="color:var(--accent); font-size:13px;">(KES ${item.price.toLocaleString()})</span></h4>
            <p>${item.cat.toUpperCase()} • ${item.spec || 'Standard'} • ${item.desc}</p>
          </div>
          <div class="item-actions">
            <button class="stock-toggle ${item.inStock ? 'in-stock' : 'out-stock'}" onclick="toggleStock(${item.id})">
              ${item.inStock ? '✓ In Stock' : '✕ Out of Stock'}
            </button>
            <button class="btn btn-ghost" style="padding:6px 10px; font-size:12px;" onclick="editPrice(${item.id})">Edit Price</button>
            <button class="btn-danger" onclick="deleteProduct(${item.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function exportCatalogJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(catalog, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "vibes-catalog-backup.json");
      dlAnchor.click();
    }
  </script>
</body>
</html>
